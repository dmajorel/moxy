# moxy behind an authenticating reverse proxy (nginx, with auth_request).
#
# Comments are in English like the rest of the tooling; docs/DEPLOIEMENT.md
# explains the reasoning in French.
#
# Drop in as /etc/nginx/conf.d/moxy.conf. This is the nginx counterpart of
# deploy/Caddyfile -- one of the two, not both. It is the component that
# authenticates; moxy authenticates nobody itself and only verifies that this
# component is in front, via the "auth" block of config.json:
#
#   {"auth": {"mode": "proxy-header",
#             "header": "X-Forwarded-User",
#             "trustedProxies": ["127.0.0.1/32"]}}
#
# Check with: nginx -t

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# nginx 1.25.1 and later. Before that, the form is "listen 443 ssl http2;".
	http2 on;
	server_name moxy.interne.example;

	ssl_certificate     /etc/ssl/moxy.crt;
	ssl_certificate_key /etc/ssl/moxy.key;
	ssl_protocols       TLSv1.2 TLSv1.3;

	# HSTS is the proxy's to add, because the proxy is what terminates TLS.
	# Everything else -- Content-Security-Policy, Referrer-Policy,
	# X-Frame-Options, Permissions-Policy, nosniff -- moxyd already sets on the
	# page it serves. Do not add a second set here: two policies for one page is
	# how a frontend ends up half blocked.
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

	# The bundle serves content-hashed assets; nothing here is worth buffering
	# into a file, and a slow upstream must not be hidden by one.
	proxy_http_version 1.1;
	proxy_buffering off;

	# Liveness and readiness stay unauthenticated, deliberately and in step with
	# moxyd, which exempts exactly these two paths: an orchestrator has no
	# identity to present, and a probe failing on authentication restarts a
	# daemon that works. They carry a status and a build identifier, nothing
	# about any cluster. Unauthenticated is still not public -- narrow them to
	# the hosts that actually probe.
	location = /healthz {
		allow 127.0.0.1;
		allow 10.0.0.0/8;
		deny all;

		# No identity is asserted on an unauthenticated path: the empty value
		# removes any header the client tried to send.
		proxy_set_header X-Forwarded-User "";
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:8080;
	}

	location = /readyz {
		allow 127.0.0.1;
		allow 10.0.0.0/8;
		deny all;

		proxy_set_header X-Forwarded-User "";
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:8080;
	}

	# The endpoints of oauth2-proxy itself (/oauth2/start, /oauth2/callback,
	# /oauth2/sign_out).
	location /oauth2/ {
		proxy_set_header Host             $host;
		proxy_set_header X-Real-IP        $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://127.0.0.1:4180;
	}

	# The subrequest nginx makes for every authenticated location below. It is
	# internal: a client cannot reach it directly.
	location = /oauth2/auth {
		internal;
		proxy_set_header Host             $host;
		proxy_set_header X-Original-URI   $request_uri;
		proxy_set_header Content-Length   "";
		proxy_pass_request_body off;
		proxy_pass http://127.0.0.1:4180;
	}

	# Everything else, and that INCLUDES /metrics. The Prometheus exposition
	# names every configured cluster and says when each was last reachable: it
	# describes the estate, so it is authenticated like the API, unlike the two
	# probes above. A scraper is a client like any other and gets credentials of
	# its own. The frontend bundle is protected for the same reason: it is the
	# topology of the estate rendered as a page.
	location / {
		auth_request /oauth2/auth;
		auth_request_set $authenticated_user $upstream_http_x_auth_request_user;

		# A browser gets a login page instead of a bare 401.
		error_page 401 = @signin;

		# NOBODY asserts an identity to moxy but this proxy. proxy_set_header
		# REPLACES whatever the client sent, so an X-Forwarded-User forged by a
		# caller never survives this line. Skipping it is worse than having no
		# check at all: the journal would then name whoever the caller claimed
		# to be.
		proxy_set_header X-Forwarded-User $authenticated_user;

		# $host is the public name, passed through, so moxyd has to know it:
		# -allowed-hosts moxy.interne.example (see deploy/moxyd.service). The
		# alternative is "proxy_set_header Host 127.0.0.1:8080;", which needs no
		# flag but hides the public name from moxy's logs.
		proxy_set_header Host             $host;
		proxy_set_header X-Real-IP        $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://127.0.0.1:8080;
	}

	location @signin {
		return 302 /oauth2/start?rd=$scheme://$host$request_uri;
	}
}

# --- Isolated workstation, no identity provider ------------------------------
# HTTP basic authentication is enough when there is one operator and no OIDC to
# talk to. Replace the /oauth2 locations and the "location /" body above with:
#
#	location / {
#		auth_basic           "moxy";
#		auth_basic_user_file /etc/nginx/moxy.htpasswd;   # htpasswd -B
#
#		proxy_set_header X-Forwarded-User $remote_user;
#		proxy_set_header Host             $host;
#		proxy_pass http://127.0.0.1:8080;
#	}

# Plain HTTP exists only to send the browser to the TLS site.
server {
	listen 80;
	listen [::]:80;
	server_name moxy.interne.example;
	return 308 https://$host$request_uri;
}
