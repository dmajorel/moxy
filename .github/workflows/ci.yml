name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two legs, on purpose.
        #
        # 1.19 is the "go" directive of apps/api/go.mod and the toolchain on the
        # maintainer's machine. This leg is what keeps "no standard library newer
        # than 1.19" a mechanical rule rather than a prose one.
        #
        # 1.27 is the supported series the container image builds with, so the
        # suite also runs against the standard library the delivered binary
        # actually links. Keep it in step with the api stage of Containerfile.
        go: ['1.19', '1.27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # No external dependencies means nothing to cache, and without a go.sum
          # setup-go's default cache would fail to resolve its path.
          cache: false

      # GOPROXY=off in the scripts: the build fails loudly if an external
      # dependency is ever introduced, which is exactly the intent.
      - name: Checks
        run: ./scripts/check.sh
        env:
          # The frontend has its own job below; check.sh would otherwise run it
          # a second time here.
          MOXY_CHECK_WEB: '0'

      # The frontend fixtures are GENERATED from the mock daemon by
      # TestMockMatchesWebFixtures. That test fails on a stale fixture, but only
      # this step catches the other mistake: regenerating them locally with
      # -update and committing the code without the regenerated files.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files. Commit the regenerated ones:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Build
        run: ./scripts/build.sh

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from apps/web/.nvmrc so the version lives in one place, next
          # to the engines range that states the real floor.
          node-version-file: apps/web/.nvmrc
          cache: npm
          # apps/web/package-lock.json is committed; without it setup-node
          # cannot resolve this path and the step fails before installing.
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: apps/web

      # check-web.sh skips the install when node_modules already exists, so the
      # step above stays the single (cached) install.
      - name: Checks
        run: ./scripts/check-web.sh

      # The frontend fixtures are GENERATED from the mock daemon by
      # TestMockMatchesWebFixtures. That test fails on a stale fixture, but only
      # this step catches the other mistake: regenerating them locally with
      # -update and committing the code without the regenerated files.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files. Commit the regenerated ones:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      # check-web.sh already runs vitest with --coverage, so the report exists
      # by the time the checks are done; this step only keeps it. lcov, so that
      # whatever reads coverage reports can read this one too.
      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: error

      - name: Build
        run: ./scripts/build-web.sh

  analysis:
    name: Backend (analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # staticcheck and govulncheck both refuse to build on 1.19. The module
          # stays `go 1.19` and compiles as it always did: this is the toolchain
          # that runs the analyzers, not the one that sets the language level.
          # Keep it in step with the api stage of Containerfile, which is the
          # toolchain the delivered binary is built with — and it is that
          # binary's standard library govulncheck is asked about.
          go-version: '1.27'
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm audit reads package-lock.json and queries the registry: it needs
          # a Node, not an install, so there is nothing to cache here.
          node-version-file: apps/web/.nvmrc

      # These are CI tools, not dependencies of the service. Run from a
      # directory outside the module, `go install pkg@version` resolves in a
      # throwaway module of its own: it cannot write apps/api/go.mod, cannot
      # create a go.sum, and puts nothing into bin/moxyd. The "standard library
      # only" rule is about what the daemon links, and that is unchanged.
      # GOPROXY is turned back on for this step alone — scripts/env.sh keeps it
      # off everywhere else, which is what makes an accidental dependency in the
      # backend fail the build.
      - name: Install the analyzers
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # govulncheck is asked about the artefact that ships, so the artefact has
      # to exist — and be produced by the same script the image uses.
      - name: Build
        run: ./scripts/build.sh

      - name: Analysis
        run: ./scripts/analyze.sh
        env:
          # An analyzer missing from PATH has to fail the job rather than be
          # skipped: a silent skip turns this whole job into a green no-op.
          MOXY_ANALYZE_REQUIRE: '1'

      # Coverage is measured here rather than in the matrix job above: once,
      # with the delivery toolchain, instead of once per leg under two names.
      - name: Coverage
        run: ./scripts/check.sh
        env:
          MOXY_CHECK_WEB: '0'
          MOXY_COVER: cover.out

      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-api
          path: apps/api/cover.out
          if-no-files-found: error

      # The same guard as the other two jobs, with one more thing to catch
      # here: a go.mod touched, or a go.sum created, by the analyzer install.
      # cover.out is gitignored, so it is not a false positive.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The analysis modified tracked files. Commit the regenerated ones:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
