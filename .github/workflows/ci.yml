name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two legs, on purpose.
        #
        # 1.19 is the "go" directive of apps/api/go.mod and the toolchain on the
        # maintainer's machine. This leg is what keeps "no standard library newer
        # than 1.19" a mechanical rule rather than a prose one.
        #
        # 1.27 is the supported series the container image builds with, so the
        # suite also runs against the standard library the delivered binary
        # actually links. Keep it in step with the api stage of Containerfile.
        go: ['1.19', '1.27']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          # No external dependencies means nothing to cache, and without a go.sum
          # setup-go's default cache would fail to resolve its path.
          cache: false

      # GOPROXY=off in the scripts: the build fails loudly if an external
      # dependency is ever introduced, which is exactly the intent.
      - name: Checks
        run: ./scripts/check.sh
        env:
          # The frontend has its own job below; check.sh would otherwise run it
          # a second time here.
          MOXY_CHECK_WEB: '0'

      - name: Build
        run: ./scripts/build.sh

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          # apps/web/package-lock.json is committed; without it setup-node
          # cannot resolve this path and the step fails before installing.
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: apps/web

      # check-web.sh skips the install when node_modules already exists, so the
      # step above stays the single (cached) install.
      - name: Checks
        run: ./scripts/check-web.sh

      - name: Build
        run: ./scripts/build-web.sh
