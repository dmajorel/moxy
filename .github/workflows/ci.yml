name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Two pushes in a row on a pull request branch would otherwise verify the
# first one for nothing. On main the run is the record that a commit passed,
# so nothing there is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: Backend
    runs-on: ubuntu-latest
    # The whole job takes about two minutes. The bound is there for the day a
    # step hangs instead of failing, which GitHub would otherwise let run for
    # six hours on a private repository's minute budget.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Two legs, on purpose.
        #
        # 1.19 is the "go" directive of apps/api/go.mod and the toolchain on the
        # maintainer's machine. This leg is what keeps "no standard library newer
        # than 1.19" a mechanical rule rather than a prose one.
        #
        # 1.27 is the supported series the container image builds with, so the
        # suite also runs against the standard library the delivered binary
        # actually links. Keep it in step with the api stage of Containerfile.
        go: ['1.19', '1.27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # No external dependencies means nothing to cache, and without a go.sum
          # setup-go's default cache would fail to resolve its path.
          cache: false

      # GOPROXY=off in the scripts: the build fails loudly if an external
      # dependency is ever introduced, which is exactly the intent.
      - name: Checks
        run: ./scripts/check.sh
        env:
          # The frontend has its own job below; check.sh would otherwise run it
          # a second time here.
          MOXY_CHECK_WEB: '0'

      # The frontend fixtures are GENERATED from the mock daemon by
      # TestMockMatchesWebFixtures. That test fails on a stale fixture, but only
      # this step catches the other mistake: regenerating them locally with
      # -update and committing the code without the regenerated files.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files. Commit the regenerated ones:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Build
        run: ./scripts/build.sh

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from apps/web/.nvmrc so the version lives in one place, next
          # to the engines range that states the real floor.
          node-version-file: apps/web/.nvmrc
          cache: npm
          # apps/web/package-lock.json is committed; without it setup-node
          # cannot resolve this path and the step fails before installing.
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: apps/web

      # check-web.sh skips the install when node_modules already exists, so the
      # step above stays the single (cached) install.
      - name: Checks
        run: ./scripts/check-web.sh

      # The frontend fixtures are GENERATED from the mock daemon by
      # TestMockMatchesWebFixtures. That test fails on a stale fixture, but only
      # this step catches the other mistake: regenerating them locally with
      # -update and committing the code without the regenerated files.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files. Commit the regenerated ones:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Build
        run: ./scripts/build-web.sh
