name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Kept apart from ci.yml so that the verification workflow keeps contents: read
# as its only permission; only this one may write packages, and only in the
# publish and prune jobs below.
permissions:
  contents: read

jobs:
  # Pull requests only prove that the image builds. Nothing is pushed, so this
  # job needs no package permission at all: the guard is the absence of the
  # permission, not an `if` on a login step that a later edit could drop.
  # One platform is enough to catch a broken Containerfile; publish builds both.
  build:
    name: Container image (build only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags to produce the version baked into the
          # binary and reported by /healthz.
          fetch-depth: 0

      - name: Version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
        id: version

      # The Containerfile cross-compiles on the build platform, so a multi-arch
      # image needs buildx but no QEMU emulation.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The debug variant has its own final stage, so nothing above would catch
      # it breaking: an apt layer rots on its own schedule. Its cache lives in a
      # scope of its own, or the two builds would overwrite each other's.
      - name: Debug variant
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          target: debug
          platforms: linux/amd64
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=debug
          cache-to: type=gha,mode=max,scope=debug

  publish:
    name: Container image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this job's OIDC token for a
      # short-lived Fulcio certificate, so nothing has to hold a private key.
      # Granted here and nowhere else.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
        id: version

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # edge tracks main, semver tags come from v* releases (which also
          # move latest), sha-* pins any pushed build.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The default provenance is "min": it names the builder but not what
          # it built. "max" records the build arguments and the source, and sbom
          # attaches the package inventory, so a consumer can answer "where does
          # this come from" and "what is inside" without scanning the image.
          provenance: mode=max
          sbom: true

      # The debug variant, published at the same occasions as the image above
      # and under the same version numbers, suffixed -debug. Never latest, and
      # never an unsuffixed tag: it carries bash, curl and a package manager,
      # which is exactly what the shipped image refuses to hold next to a
      # hypervisor token. No sha- tag either — it is a tool to reach for now,
      # not something a deployment pins, and each one is a package version the
      # retention has to carry.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-debug
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-debug
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # linux/amd64 only: the debug stage installs its packages with apt, which
      # runs on the target platform, so a second architecture would mean QEMU in
      # this job. The README points arm64 operators at the ephemeral container
      # that needs no published variant at all.
      - name: Debug variant
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-debug
        with:
          context: .
          file: Containerfile
          target: debug
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta-debug.outputs.tags }}
          labels: ${{ steps.meta-debug.outputs.labels }}
          cache-from: type=gha,scope=debug
          cache-to: type=gha,mode=max,scope=debug
          # The variant has by far the most packages of the two, so the SBOM is
          # worth more here than anywhere else: it is what answers "is this
          # image affected" without pulling it.
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the index by digest, never by tag: a tag is mutable, and signing
      # what a tag pointed at a second ago proves nothing about what it points
      # at now. The signature covers the multi-arch index, hence every manifest
      # under it. Verify with:
      #   cosign verify ghcr.io/dmajorel/moxy:edge \
      #     --certificate-identity-regexp '^https://github.com/dmajorel/moxy/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign
        run: |
          cosign sign --yes "ghcr.io/${IMAGE}@${DIGEST}"
          cosign sign --yes "ghcr.io/${IMAGE}@${DIGEST_DEBUG}"
        env:
          IMAGE: ${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DEBUG: ${{ steps.build-debug.outputs.digest }}

  # Retention rides along with the publish rather than waiting for the weekly
  # sweep: a busy day merges a dozen times, and five images deep is a promise
  # that only holds if it is enforced at the same rate images appear. The weekly
  # schedule stays as the backstop for the days nothing is pushed.
  prune:
    name: Registry retention
    needs: publish
    uses: ./.github/workflows/image-retention.yml
    permissions:
      contents: read
      packages: write
    with:
      apply: true
    secrets: inherit
