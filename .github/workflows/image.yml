name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Kept apart from ci.yml so that the verification workflow keeps contents: read
# as its only permission; only this one may write packages.
permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags to produce the version baked into the
          # binary and reported by /healthz.
          fetch-depth: 0

      - name: Version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
        id: version

      # The Containerfile cross-compiles on the build platform, so a multi-arch
      # image needs buildx but no QEMU emulation.
      - uses: docker/setup-buildx-action@v3

      # Pull requests only prove that the image builds: nothing is pushed and
      # the token of a fork has no package permission anyway.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # edge tracks main, semver tags come from v* releases (which also
          # move latest), sha-* pins any pushed build.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
