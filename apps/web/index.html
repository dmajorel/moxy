<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>moxy</title>
    <!--
      Stamps the stored theme on <html> before the first paint; see
      public/theme-boot.js for what it does and why it is not in the bundle.

      Classic and blocking on purpose: no type="module" and no defer, either of
      which would run it after the document was parsed, once the browser had
      already painted the light theme. A file rather than an inline script so
      that the Content-Security-Policy moxyd serves needs no 'unsafe-inline'.
    -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
